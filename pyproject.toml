[project]
name = "ooc-bench"
version = "0.2.1"
description = "Out-of-Control Bench: ControlArena setting for AI cyber-defense evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "pydantic",
    "requests>=2.32.4",
    "fastapi[standard]>=0.116.1",
    "marimo>=0.18.2",
    "scikit-learn>=1.7.2",
    "nltk>=3.9.2",
    "tqdm>=4.67.1",
    "mcp>=1.23.1",
    "openai>=2.9.0",
    "numpy>=2.3.5",
    "matplotlib>=3.10.7",
    "control-arena>=19.0.0",
    "inspect-proxmox-sandbox",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "commitizen>=3.27.0",
    "jupyter>=1.1.1",
    "python-dotenv>=1.0.1",
]
test = [
    "ruff>=0.7.4",
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.uv.sources]
inspect-proxmox-sandbox = { git = "https://github.com/UKGovernmentBEIS/inspect_proxmox_sandbox" }
